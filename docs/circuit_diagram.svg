<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Digital ID Card - Wiring Diagram</text>

  <!-- ========== ESP32-C3 ========== -->
  <rect x="360" y="70" width="200" height="415" rx="10" fill="#e8f0fe" stroke="#1a56c4" stroke-width="2"/>
  <text x="460" y="92" text-anchor="middle" font-weight="bold" font-size="14" fill="#1a56c4">ESP32-C3 SuperMini</text>
  <g fill="#222">
    <text x="372" y="134">GPIO 0</text>
    <text x="372" y="164">GPIO 1</text>
    <text x="372" y="279">GPIO 4</text>
    <text x="372" y="309">GPIO 5</text>
    <text x="372" y="339">GPIO 6</text>
    <text x="372" y="369">GPIO 7</text>
    <text x="372" y="399">GPIO 10</text>
    <text x="548" y="114" text-anchor="end">5V</text>
    <text x="548" y="164" text-anchor="end">GND</text>
    <text x="548" y="214" text-anchor="end">3V3</text>
    <text x="548" y="304" text-anchor="end">GPIO 3</text>
    <text x="548" y="354" text-anchor="end">GPIO 20</text>
  </g>

  <!-- ========== OLED ========== -->
  <rect x="40" y="50" width="180" height="140" rx="8" fill="#fff4d6" stroke="#b07d00" stroke-width="2"/>
  <text x="130" y="68" text-anchor="middle" font-weight="bold" fill="#7a5500">0.96" OLED SSD1306 (I2C)</text>
  <g fill="#222">
    <text x="52" y="94">VCC</text>
    <text x="52" y="114">GND</text>
    <text x="52" y="134">SDA</text>
    <text x="52" y="164">SCL</text>
  </g>

  <!-- ========== TFT ========== -->
  <rect x="40" y="200" width="180" height="235" rx="8" fill="#e3f6e8" stroke="#1e7a3a" stroke-width="2"/>
  <text x="130" y="218" text-anchor="middle" font-weight="bold" fill="#14562a">1.69" TFT ST7789 (SPI)</text>
  <g fill="#222">
    <text x="52" y="230">VCC</text>
    <text x="52" y="242">GND</text>
    <text x="52" y="279">RST</text>
    <text x="52" y="309">SDA (MOSI)</text>
    <text x="52" y="339">SCL (CLK)</text>
    <text x="52" y="369">CS</text>
    <text x="52" y="399">DC</text>
  </g>

  <!-- OLED / TFT power tags -->
  <g fill="#d62728" font-weight="bold">
    <text x="190" y="94" text-anchor="end">3V3</text>
    <text x="190" y="230" text-anchor="end">3V3</text>
  </g>
  <g fill="#111" font-weight="bold">
    <text x="190" y="114" text-anchor="end">GND</text>
    <text x="190" y="242" text-anchor="end">GND</text>
  </g>

  <!-- Signal wires (straight, no crossings) -->
  <g fill="none" stroke-width="2.5">
    <path d="M220 130 H360" stroke="#1f77b4"/>
    <path d="M220 160 H360" stroke="#ff7f0e"/>
    <path d="M220 275 H360" stroke="#bcbd22"/>
    <path d="M220 305 H360" stroke="#8c564b"/>
    <path d="M220 335 H360" stroke="#9467bd"/>
    <path d="M220 365 H360" stroke="#e377c2"/>
    <path d="M220 395 H360" stroke="#17becf"/>
  </g>
  <g fill="#222" font-size="11">
    <text x="290" y="125" text-anchor="middle">SDA</text>
    <text x="290" y="155" text-anchor="middle">SCL</text>
    <text x="290" y="270" text-anchor="middle">RST</text>
    <text x="290" y="300" text-anchor="middle">MOSI</text>
    <text x="290" y="330" text-anchor="middle">SCLK</text>
    <text x="290" y="360" text-anchor="middle">CS</text>
    <text x="290" y="390" text-anchor="middle">DC</text>
  </g>
  <text x="580" y="214" fill="#d62728" font-weight="bold" font-size="11">3V3 pin powers OLED + TFT VCC</text>
  <path d="M560 210 H575" stroke="#d62728" stroke-width="2.5"/>

  <!-- ========== Power chain ========== -->
  <!-- TP4056 -->
  <rect x="740" y="60" width="190" height="140" rx="8" fill="#fde8e8" stroke="#b32f2f" stroke-width="2"/>
  <text x="835" y="80" text-anchor="middle" font-weight="bold" fill="#7a1f1f">TP4056 USB-C charger</text>
  <text x="752" y="114" fill="#222">OUT+ (load)</text>
  <text x="752" y="164" fill="#222">OUT- (load)</text>
  <text x="835" y="194" text-anchor="middle" fill="#222" font-size="11">B+ / B- pads below</text>

  <!-- Switch -->
  <path d="M560 110 H620" stroke="#d62728" stroke-width="2.5" fill="none"/>
  <rect x="620" y="96" width="80" height="28" rx="5" fill="#eeeeee" stroke="#555" stroke-width="2"/>
  <text x="660" y="115" text-anchor="middle" fill="#222" font-weight="bold">SWITCH</text>
  <path d="M700 110 H740" stroke="#d62728" stroke-width="2.5" fill="none"/>
  <!-- GND -->
  <path d="M560 160 H740" stroke="#111" stroke-width="2.5" fill="none"/>
  <text x="650" y="154" text-anchor="middle" fill="#111" font-size="11">GND</text>

  <!-- Battery -->
  <rect x="740" y="225" width="190" height="55" rx="8" fill="#fff0e0" stroke="#c46a00" stroke-width="2"/>
  <text x="835" y="249" text-anchor="middle" font-weight="bold" fill="#7a4000">3.7V 1800mAh Li-Po</text>
  <text x="835" y="268" text-anchor="middle" fill="#222" font-size="11">(+) red     (-) black</text>
  <path d="M800 200 V225" stroke="#d62728" stroke-width="2.5"/>
  <path d="M870 200 V225" stroke="#111" stroke-width="2.5"/>
  <text x="794" y="216" text-anchor="end" fill="#d62728" font-size="11">B+</text>
  <text x="876" y="216" fill="#111" font-size="11">B-</text>

  <!-- ========== Buttons ========== -->
  <path d="M560 300 H700" stroke="#6b2fb3" stroke-width="2.5" fill="none"/>
  <rect x="700" y="287" width="90" height="26" rx="5" fill="#f3e8ff" stroke="#6b2fb3" stroke-width="2"/>
  <text x="745" y="305" text-anchor="middle" fill="#4a1f80" font-weight="bold">NEXT</text>
  <path d="M790 300 H830" stroke="#111" stroke-width="2.5" fill="none"/>
  <text x="838" y="304" fill="#111" font-weight="bold">GND</text>

  <path d="M560 350 H700" stroke="#6b2fb3" stroke-width="2.5" fill="none"/>
  <rect x="700" y="337" width="90" height="26" rx="5" fill="#f3e8ff" stroke="#6b2fb3" stroke-width="2"/>
  <text x="745" y="355" text-anchor="middle" fill="#4a1f80" font-weight="bold">PREV</text>
  <path d="M790 350 H830" stroke="#111" stroke-width="2.5" fill="none"/>
  <text x="838" y="354" fill="#111" font-weight="bold">GND</text>

  <!-- Legend -->
  <text x="480" y="520" text-anchor="middle" fill="#555">Red = positive supply, black = ground, other colours = signal wires.</text>
  <text x="480" y="540" text-anchor="middle" fill="#555">GND pins of all parts share the ESP32 GND. Full pin tables in README.md.</text>
</svg>
